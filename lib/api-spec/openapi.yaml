openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API Connect — API REST para gerenciamento de usuários em memória
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: usuarios
    description: Gerenciamento de usuários
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /usuarios:
    get:
      operationId: listarUsuarios
      tags: [usuarios]
      summary: Listar usuários
      description: Retorna todos os usuários cadastrados
      responses:
        "200":
          description: Usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
    post:
      operationId: criarUsuario
      tags: [usuarios]
      summary: Criar usuário
      description: Cria um novo usuário em memória
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosUsuarioCadastro"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          description: Nome ou e-mail não informado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /usuarios/{id}:
    get:
      operationId: buscarUsuario
      tags: [usuarios]
      summary: Buscar usuário
      description: Retorna um usuário pelo ID
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: atualizarUsuarioPorId
      tags: [usuarios]
      summary: Atualizar usuário por ID
      description: Atualiza os dados de um usuário pelo ID
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarUsuarioBody"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: excluirUsuarioPorId
      tags: [usuarios]
      summary: Excluir usuário por ID
      description: Exclui um usuário pelo ID
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      responses:
        "200":
          description: Usuário excluído
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: "#/components/schemas/Usuario"
                required: [mensagem, usuario]
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Usuario:
      type: object
      properties:
        id:
          type: number
        nome:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          maxLength: 254
      required:
        - id
        - nome
        - email
    DadosUsuarioCadastro:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          maxLength: 254
      required:
        - nome
        - email
    AtualizarUsuarioBody:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          maxLength: 254
    ErrorResponse:
      type: object
      properties:
        erro:
          type: string
      required:
        - erro
  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      description: ID numérico do usuário
      schema:
        type: number

